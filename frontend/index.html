<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 智能食谱助手</title>
<style>
/* ═══════════════ Reset & Base ═══════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f0f2f5;
  --bg-card: rgba(255,255,255,0.85);
  --bg-card-hover: rgba(255,255,255,0.95);
  --bg-glass: rgba(255,255,255,0.25);
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: rgba(0,0,0,0.08);
  --primary: #f97316;
  --primary-light: #fb923c;
  --primary-dark: #ea580c;
  --primary-bg: rgba(249,115,22,0.1);
  --user-msg: #f97316;
  --user-msg-text: #fff;
  --bot-msg: #fff;
  --bot-msg-text: #1a1a2e;
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 300px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --bg-card: rgba(30,41,59,0.85);
  --bg-card-hover: rgba(30,41,59,0.95);
  --bg-glass: rgba(30,41,59,0.4);
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: rgba(255,255,255,0.08);
  --primary-bg: rgba(249,115,22,0.15);
  --bot-msg: #1e293b;
  --bot-msg-text: #f1f5f9;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --shadow-hover: 0 12px 40px rgba(0,0,0,0.4);
}

html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  transition: background var(--transition), color var(--transition);
}

/* ═══════════════ Gradient Background ═══════════════ */
.bg-gradient {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse at 10% 20%, rgba(249,115,22,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(251,146,60,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(249,115,22,0.05) 0%, transparent 70%);
  transition: opacity var(--transition);
}
[data-theme="dark"] .bg-gradient { opacity: 0.5; }

/* ═══════════════ Layout ═══════════════ */
.app { display: flex; height: 100vh; position: relative; }

/* ═══════════════ Sidebar ═══════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition), background var(--transition);
  z-index: 10;
}
.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-header .logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3);
  flex-shrink: 0;
}
.sidebar-header h1 { font-size: 1.1rem; font-weight: 700; }
.sidebar-header h1 span { display: block; font-size: 0.75rem; font-weight: 400; color: var(--text-secondary); margin-top: 2px; }

.sidebar-actions {
  padding: 12px 16px;
  display: flex; gap: 8px;
}
.btn-new-chat {
  flex: 1;
  padding: 10px 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-new-chat:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-bg);
}

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}
.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.session-item {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; gap: 10px;
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.session-item:hover { background: var(--primary-bg); color: var(--text); }
.session-item.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 12px rgba(249,115,22,0.25);
}
.session-item .icon { font-size: 1rem; flex-shrink: 0; }
.session-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item .time { font-size: 0.7rem; opacity: 0.6; flex-shrink: 0; }
.session-item .delete-btn {
  opacity: 0; width: 20px; height: 20px;
  border: none; background: none; cursor: pointer;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: inherit;
  transition: opacity var(--transition);
  flex-shrink: 0;
}
.session-item:hover .delete-btn { opacity: 0.5; }
.session-item .delete-btn:hover { opacity: 1; background: rgba(255,0,0,0.15); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.theme-toggle {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 1rem;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { background: var(--primary-bg); border-color: var(--primary); }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #22c55e;
  flex-shrink: 0;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-text { font-size: 0.75rem; color: var(--text-secondary); flex: 1; }

/* ═══════════════ Main Chat Area ═══════════════ */
.main {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
  position: relative;
}

/* Chat Header */
.chat-header {
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  flex-shrink: 0;
}
.chat-header .avatar {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--primary), #fbbf24);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.chat-header .info { flex: 1; }
.chat-header .info h2 { font-size: 0.95rem; font-weight: 600; }
.chat-header .info p { font-size: 0.75rem; color: var(--text-secondary); }
.chat-header .model-badge {
  padding: 4px 12px;
  border-radius: 20px;
  background: var(--primary-bg);
  color: var(--primary);
  font-size: 0.75rem;
  font-weight: 500;
  border: 1px solid rgba(249,115,22,0.2);
}

/* ═══════════════ Messages ═══════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }

.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px 20px;
}
.welcome .icon { font-size: 4rem; margin-bottom: 20px; }
.welcome h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), #fbbf24);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome p { color: var(--text-secondary); max-width: 420px; line-height: 1.6; margin-bottom: 24px; }
.welcome .suggestions {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 500px;
}
.welcome .suggestions .chip {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.welcome .suggestions .chip:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-bg);
  transform: translateY(-1px);
}

/* Message Bubbles */
.msg { display: flex; gap: 12px; margin-bottom: 20px; animation: msg-in 0.35s ease; }
@keyframes msg-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.msg.user { flex-direction: row-reverse; }
.msg .avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem;
}
.msg.user .avatar { background: var(--primary); color: #fff; }
.msg.bot .avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }

.msg .bubble {
  max-width: 72%;
  padding: 14px 18px;
  border-radius: 18px;
  line-height: 1.65;
  font-size: 0.92rem;
  position: relative;
}
.msg.user .bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: var(--user-msg-text);
  border-bottom-right-radius: 4px;
}
.msg.bot .bubble {
  background: var(--bot-msg);
  color: var(--bot-msg-text);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow);
}

.msg .bubble .intent-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 500;
  margin-bottom: 8px;
  background: var(--primary-bg);
  color: var(--primary);
}

.msg .bubble .timestamp {
  font-size: 0.65rem;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: right;
}

/* Streaming cursor */
.msg .bubble .cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--primary);
  margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Sources */
.sources {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 0.78rem;
}
.sources summary {
  cursor: pointer;
  color: var(--text-secondary);
  font-weight: 500;
  user-select: none;
}
.sources summary:hover { color: var(--primary); }
.sources .source-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px;
}
.sources .source-item:last-child { border-bottom: none; }
.sources .source-item .tag {
  padding: 1px 8px;
  border-radius: 6px;
  font-size: 0.65rem;
  font-weight: 600;
  background: var(--primary-bg);
  color: var(--primary);
  flex-shrink: 0;
  height: fit-content;
}
.sources .source-item .snippet {
  color: var(--text-secondary);
  font-size: 0.75rem;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* ═══════════════ Input Area ═══════════════ */
.input-area {
  padding: 16px 28px 20px;
  flex-shrink: 0;
  background: linear-gradient(transparent, var(--bg) 40%);
}
.input-wrapper {
  display: flex; gap: 10px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 6px;
  box-shadow: var(--shadow);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input-wrapper:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(249,115,22,0.15), var(--shadow);
}
.input-wrapper textarea {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 12px;
  font-size: 0.92rem;
  font-family: var(--font);
  color: var(--text);
  resize: none;
  outline: none;
  min-height: 24px;
  max-height: 120px;
  line-height: 1.5;
}
.input-wrapper textarea::placeholder { color: var(--text-muted); }

.input-actions {
  display: flex; align-items: center; gap: 4px;
  padding-right: 4px;
}
.input-actions button {
  width: 36px; height: 36px;
  border: none;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--text-secondary);
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.input-actions button:hover { background: var(--primary-bg); color: var(--primary); }
.input-actions .file-badge {
  position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px;
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  font-size: 0.55rem;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.input-actions .send-btn {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border-radius: 12px;
  font-size: 1.1rem;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3);
}
.input-actions .send-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(249,115,22,0.4);
}
.input-actions .send-btn:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}
.input-actions .send-btn.loading {
  animation: pulse-btn 1.2s infinite;
}
@keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.7} }

/* ═══════════════ File Preview ═══════════════ */
.file-preview {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 0 4px 8px 4px;
}
.file-preview .file-tag {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--primary-bg);
  border: 1px solid rgba(249,115,22,0.2);
  font-size: 0.78rem;
  color: var(--primary);
}
.file-preview .file-tag .remove {
  cursor: pointer;
  opacity: 0.5;
  transition: opacity var(--transition);
}
.file-preview .file-tag .remove:hover { opacity: 1; }

/* ═══════════════ Hidden file input ═══════════════ */
#file-input { display: none; }

/* ═══════════════ Mobile sidebar toggle ═══════════════ */
.sidebar-toggle {
  display: none;
  position: fixed; top: 12px; left: 12px; z-index: 20;
  width: 40px; height: 40px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  cursor: pointer;
  font-size: 1.2rem;
  transition: all var(--transition);
  box-shadow: var(--shadow);
  align-items: center; justify-content: center;
}
.sidebar-toggle:hover { border-color: var(--primary); color: var(--primary); }

.sidebar-overlay { display: none; }

/* ═══════════════ Responsive ═══════════════ */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-hover);
    z-index: 30;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 25;
    background: rgba(0,0,0,0.3);
  }
  .sidebar-overlay.show { display: block; }
  .sidebar-toggle { display: flex; }
  .chat-header { padding: 16px 16px 16px 60px; }
  .messages { padding: 16px; }
  .input-area { padding: 12px 16px 16px; }
  .msg .bubble { max-width: 88%; }
}

/* ═══════════════ Toast ═══════════════ */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px;
  border-radius: 12px;
  background: #1a1a2e;
  color: #fff;
  font-size: 0.85rem;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
[data-theme="dark"] .toast { background: #334155; }

/* ═══════════════ Scrollbar global ═══════════════ */
*::-webkit-scrollbar { width: 5px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
*::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="app">

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar Toggle (mobile) -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏">☰</button>

  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">🍳</div>
      <h1>食谱助手<small style="display:block;font-size:0.7rem;font-weight:400;color:var(--text-secondary);margin-top:1px;">Multi-Modal Recipe Assistant</small></h1>
    </div>

    <div class="sidebar-actions">
      <button class="btn-new-chat" id="newChatBtn">
        <span>＋</span> 新建对话
      </button>
    </div>

    <div class="session-list" id="sessionList">
      <!-- Sessions rendered by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">服务运行中</span>
    </div>
  </aside>

  <!-- ═══ Main Chat ═══ -->
  <main class="main">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="info">
        <h2>智能食谱助手</h2>
        <p id="chatModelInfo">Qwen3.5-35B · 多模态</p>
      </div>
      <div class="model-badge" id="sessionBadge">新对话</div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="icon">🍳</div>
        <h2>有什么想吃的吗？</h2>
        <p>我可以帮你推荐菜谱、查询营养信息、替换食材、搜索菜品图片，甚至解析 PDF 食谱文档！</p>
        <div class="suggestions">
          <button class="chip" data-q="红烧肉怎么做？">红烧肉怎么做？</button>
          <button class="chip" data-q="推荐一个低卡甜点">推荐一个低卡甜点</button>
          <button class="chip" data-q="鸡蛋可以用什么代替？">鸡蛋可以用什么代替？</button>
          <button class="chip" data-q="卡布奇诺的热量">卡布奇诺的热量</button>
          <button class="chip" data-q="有没有鸡肉的菜谱">有没有鸡肉的菜谱</button>
          <button class="chip" data-q="番茄炒蛋的步骤">番茄炒蛋的步骤</button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="file-preview" id="filePreview"></div>
      <div class="input-wrapper">
        <textarea id="input" rows="1" placeholder="输入你的问题… (Enter 发送, Shift+Enter 换行)"></textarea>
        <div class="input-actions">
          <button id="fileBtn" title="上传图片或 PDF">📎</button>
          <button id="sendBtn" class="send-btn" title="发送">➤</button>
        </div>
      </div>
    </div>
  </main>

</div>

<input type="file" id="file-input" accept="image/*,.pdf" multiple>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   食谱助手 Frontend — Main JS
   ═══════════════════════════════════════════════ */

// ── Config ──
const API_BASE = window.location.origin;
const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB

// ── State ──
const state = {
  sessions: [],
  currentSessionId: null,
  messages: {},       // sessionId -> [{role, content, intent, timestamp, sources}]
  uploadedFiles: [],  // [{name, base64, type, size}]
  isLoading: false,
  currentStreamText: '',
};

// ── DOM refs ──
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const msgArea = $('#messages');
const welcome = $('#welcome');
const input = $('#input');
const sendBtn = $('#sendBtn');
const fileBtn = $('#fileBtn');
const fileInput = $('#file-input');
const filePreview = $('#filePreview');
const sessionList = $('#sessionList');
const newChatBtn = $('#newChatBtn');
const themeToggle = $('#themeToggle');
const sidebarToggle = $('#sidebarToggle');
const sidebarOverlay = $('#sidebarOverlay');
const sidebar = $('#sidebar');
const sessionBadge = $('#sessionBadge');
const toastEl = $('#toast');

// ── Utility ──
function uuid() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  if (d.toDateString() === now.toDateString()) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function getSessionName(messages) {
  // Use first user message as session name
  for (const m of messages) { if (m.role === 'user') return m.content.slice(0, 30) + (m.content.length > 30 ? '…' : ''); }
  return '新对话';
}

function scrollToBottom() {
  requestAnimationFrame(() => { msgArea.scrollTop = msgArea.scrollHeight; });
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ── Session Management ──
function loadSessions() {
  try {
    const data = JSON.parse(localStorage.getItem('recipe_sessions') || '{}');
    state.sessions = Object.entries(data).map(([id, s]) => ({ id, ...s }));
    state.messages = {};
    for (const s of state.sessions) {
      state.messages[s.id] = s.messages || [];
    }
  } catch { state.sessions = []; state.messages = {}; }
}

function saveSessions() {
  const data = {};
  for (const s of state.sessions) {
    data[s.id] = { name: s.name, createdAt: s.createdAt, lastActive: s.lastActive };
    // Save messages separately
  }
  localStorage.setItem('recipe_sessions', JSON.stringify(data));
  // Save messages
  try {
    localStorage.setItem('recipe_messages', JSON.stringify(state.messages));
  } catch {
    // localStorage quota exceeded, trim oldest sessions
    while (state.sessions.length > 10) {
      const oldest = state.sessions.pop();
      delete state.messages[oldest.id];
    }
    try { localStorage.setItem('recipe_messages', JSON.stringify(state.messages)); } catch {}
  }
}

function loadMessages() {
  try {
    const data = JSON.parse(localStorage.getItem('recipe_messages') || '{}');
    for (const [k, v] of Object.entries(data)) {
      if (!state.messages[k]) state.messages[k] = v;
    }
  } catch {}
}

function createSession() {
  const id = uuid();
  const now = Date.now();
  state.sessions.unshift({ id, name: '新对话', createdAt: now, lastActive: now });
  state.messages[id] = [];
  state.currentSessionId = id;
  renderSessions();
  renderMessages();
  saveSessions();
  updateChatHeader();
  return id;
}

function deleteSession(id) {
  state.sessions = state.sessions.filter(s => s.id !== id);
  delete state.messages[id];
  if (state.currentSessionId === id) {
    state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null;
    if (state.currentSessionId) renderMessages();
    else {
      welcome.style.display = 'flex';
      msgArea.innerHTML = ''; msgArea.appendChild(welcome);
      updateChatHeader();
    }
  }
  renderSessions();
  saveSessions();
}

function switchSession(id) {
  if (id === state.currentSessionId) return;
  state.currentSessionId = id;
  renderSessions();
  renderMessages();
  updateChatHeader();
  // Close sidebar on mobile
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
}

function getOrCreateSession() {
  if (!state.currentSessionId || !state.messages[state.currentSessionId]) {
    return createSession();
  }
  return state.currentSessionId;
}

function updateChatHeader() {
  const sid = state.currentSessionId;
  if (!sid || !state.messages[sid]) {
    sessionBadge.textContent = '新对话';
    return;
  }
  const msgs = state.messages[sid];
  const count = msgs.filter(m => m.role === 'user').length;
  sessionBadge.textContent = count > 0 ? `${count} 轮对话` : '新对话';
}

// ── Render ──
function renderSessions() {
  sessionList.innerHTML = state.sessions.map(s => `
    <div class="session-item ${s.id === state.currentSessionId ? 'active' : ''}" data-id="${s.id}">
      <span class="icon">💬</span>
      <span class="name">${s.name}</span>
      <span class="time">${formatTime(s.lastActive)}</span>
      <button class="delete-btn" data-id="${s.id}" title="删除会话">✕</button>
    </div>
  `).join('');

  // Events
  sessionList.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.delete-btn')) return;
      switchSession(el.dataset.id);
    });
  });
  sessionList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSession(btn.dataset.id);
    });
  });
}

function renderMessages() {
  const sid = state.currentSessionId;
  msgArea.innerHTML = '';
  if (!sid || !state.messages[sid] || state.messages[sid].length === 0) {
    msgArea.appendChild(welcome);
    welcome.style.display = 'flex';
    return;
  }
  welcome.style.display = 'none';

  for (const m of state.messages[sid]) {
    appendMessageDOM(m.role, m.content, m.intent, m.timestamp, m.sources, false);
  }
  scrollToBottom();
}

function appendMessageDOM(role, content, intent, timestamp, sources, animate = true) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.style.animation = animate ? 'msg-in 0.35s ease' : 'none';

  const avatar = role === 'user' ? '👤' : '🤖';
  const timeStr = timestamp ? formatTime(timestamp) : formatTime(Date.now());

  let sourcesHtml = '';
  if (sources && sources.length > 0) {
    sourcesHtml = `
      <details class="sources">
        <summary>📚 ${sources.length} 个来源</summary>
        ${sources.map(s => `
          <div class="source-item">
            <span class="tag">${s.source || 'rag'}</span>
            <span class="snippet">${escapeHtml(s.snippet || s.content || '')}</span>
          </div>
        `).join('')}
      </details>`;
  }

  div.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble">
      ${intent ? `<div class="intent-tag">${intent}</div>` : ''}
      <div class="text">${escapeHtml(content)}</div>
      ${sourcesHtml}
      <div class="timestamp">${timeStr}</div>
    </div>
  `;

  // Remove welcome if present
  const welc = msgArea.querySelector('#welcome');
  if (welc) welc.style.display = 'none';

  msgArea.appendChild(div);
  scrollToBottom();
  return div;
}

function appendStreamingBubble() {
  const sid = state.currentSessionId;
  if (!sid) return;

  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'streaming-msg';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="intent-tag" id="streaming-intent"></div>
      <div class="text" id="streaming-text"></div>
      <span class="cursor" id="streaming-cursor">|</span>
    </div>
  `;
  msgArea.appendChild(div);
  scrollToBottom();
  return div;
}

function updateStreamingText(text) {
  const el = document.getElementById('streaming-text');
  if (el) el.textContent = text;
}

function updateStreamingIntent(intent) {
  const el = document.getElementById('streaming-intent');
  if (el && intent) el.textContent = intent;
}

function finishStreaming(provenance) {
  const cursor = document.getElementById('streaming-cursor');
  if (cursor) cursor.remove();

  const bubble = document.querySelector('#streaming-msg .bubble');
  if (bubble && provenance && provenance.length > 0) {
    const sourcesHtml = `
      <details class="sources">
        <summary>📚 ${provenance.length} 个来源</summary>
        ${provenance.map(s => `
          <div class="source-item">
            <span class="tag">${s.source || 'rag'}</span>
            <span class="snippet">${escapeHtml(s.snippet || '')}</span>
          </div>
        `).join('')}
      </details>`;
    bubble.insertAdjacentHTML('beforeend', sourcesHtml);
  }

  // Add timestamp
  if (bubble) {
    bubble.insertAdjacentHTML('beforeend', `<div class="timestamp">${formatTime(Date.now())}</div>`);
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ── File Upload ──
fileBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  for (const file of fileInput.files) {
    if (state.uploadedFiles.length >= 5) { showToast('最多上传 5 个文件'); break; }
    if (file.size > MAX_FILE_SIZE) { showToast(`${file.name} 超过 20MB 限制`); continue; }
    try {
      const base64 = await fileToBase64(file);
      state.uploadedFiles.push({ name: file.name, base64, type: file.type, size: file.size });
    } catch { showToast(`${file.name} 读取失败`); }
  }
  fileInput.value = '';
  renderFilePreview();
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderFilePreview() {
  if (state.uploadedFiles.length === 0) { filePreview.innerHTML = ''; return; }
  filePreview.innerHTML = state.uploadedFiles.map((f, i) => `
    <span class="file-tag">
      ${f.type.startsWith('image/') ? '🖼️' : '📄'} ${f.name}
      <span class="remove" data-idx="${i}">✕</span>
    </span>
  `).join('');
  filePreview.querySelectorAll('.remove').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      state.uploadedFiles.splice(idx, 1);
      renderFilePreview();
    });
  });
}

// ── Send Message ──
async function sendMessage() {
  const text = input.value.trim();
  if (!text && state.uploadedFiles.length === 0) return;
  if (state.isLoading) return;

  state.isLoading = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('loading');
  sendBtn.textContent = '…';

  // Get or create session
  const sid = getOrCreateSession();
  const files = [...state.uploadedFiles];
  const hasImages = files.filter(f => f.type.startsWith('image/'));
  const hasPdfs = files.filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));

  // Add user message
  let userContent = text;
  if (files.length > 0) {
    userContent += ` [附件: ${files.map(f => f.name).join(', ')}]`;
  }
  state.messages[sid].push({
    role: 'user',
    content: text,
    timestamp: Date.now(),
  });

  // Update session name
  const sess = state.sessions.find(s => s.id === sid);
  if (sess) {
    sess.name = getSessionName(state.messages[sid]);
    sess.lastActive = Date.now();
  }

  // Render
  appendMessageDOM('user', text, null, Date.now(), null);
  input.value = '';
  input.style.height = 'auto';
  renderSessions();
  saveSessions();
  updateChatHeader();

  // Clear files
  state.uploadedFiles = [];
  renderFilePreview();

  // Streaming
  appendStreamingBubble();
  let fullText = '';
  let finalIntent = '';
  let finalProvenance = [];

  try {
    const payload = {
      query: text,
      files: files.filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf')).map(f => f.base64),
      images: files.filter(f => f.type.startsWith('image/')).map(f => f.base64),
      session_id: sid,
      stream: true,
    };

    const response = await fetch(`${API_BASE}/ask/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          const eventType = line.slice(7).trim();
          // Next line should be data
          continue;
        }
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            handleSSEEvent(data);
          } catch {}
        }
        // Also handle SSE format: event + data on separate lines
        if (line === '') continue;
      }
    }

    // Handle remaining buffer
    if (buffer.startsWith('data: ')) {
      try {
        const data = JSON.parse(buffer.slice(6));
        handleSSEEvent(data);
      } catch {}
    }

  } catch (err) {
    // Fallback to non-streaming
    console.warn('Streaming failed, falling back to /ask', err);
    try {
      const resp = await fetch(`${API_BASE}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: text,
          files: files.filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf')).map(f => f.base64),
          images: files.filter(f => f.type.startsWith('image/')).map(f => f.base64),
          session_id: sid,
          stream: false,
        }),
      });
      const data = await resp.json();
      fullText = data.answer || '';
      finalIntent = data.intent || '';
      finalProvenance = data.provenance || [];
      updateStreamingIntent(finalIntent);
      updateStreamingText(fullText);
    } catch (e) {
      fullText = '❌ 服务暂时不可用，请稍后再试。';
      updateStreamingText(fullText);
    }
  }

  // Helper
  function handleSSEEvent(data) {
    if (data.event === 'start' || data.type === 'start') return;
    if (data.type === 'chunk' || data.event === 'token') {
      const text = data.text || '';
      fullText += text;
      state.currentStreamText = fullText;
      updateStreamingText(fullText);
      return;
    }
    if (data.event === 'done') {
      finalIntent = data.intent || data.intent_hint || '';
      finalProvenance = data.provenance || [];
      if (data.answer) { fullText = data.answer; updateStreamingText(fullText); }
      return;
    }
    if (data.event === 'provenance' || data.type === 'provenance') {
      if (data.items) finalProvenance = data.items;
      return;
    }
    if (data.event === 'error') {
      fullText = data.message || '处理出错了，请重试。';
      updateStreamingText(fullText);
      return;
    }
    // Also handle direct response (non-SSE fallback)
    if (data.answer) {
      fullText = data.answer;
      finalIntent = data.intent || '';
      finalProvenance = data.provenance || [];
      updateStreamingIntent(finalIntent);
      updateStreamingText(fullText);
    }
  }

  // Finish streaming
  finishStreaming(finalProvenance);
  const streamingMsg = document.getElementById('streaming-msg');
  if (streamingMsg) streamingMsg.id = '';

  // Save to messages
  state.messages[sid].push({
    role: 'assistant',
    content: fullText,
    intent: finalIntent,
    timestamp: Date.now(),
    sources: finalProvenance,
  });

  // Update session name if first message
  const s = state.sessions.find(s => s.id === sid);
  if (s) {
    s.name = getSessionName(state.messages[sid]);
    s.lastActive = Date.now();
  }
  renderSessions();
  saveSessions();
  updateChatHeader();

  state.isLoading = false;
  sendBtn.disabled = false;
  sendBtn.classList.remove('loading');
  sendBtn.textContent = '➤';
  input.focus();
}

// ── Events ──
sendBtn.addEventListener('click', sendMessage);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Suggestion chips
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    input.value = chip.dataset.q;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    input.focus();
    sendMessage();
  }
});

// Sidebar toggle (mobile)
sidebarToggle.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  sidebarOverlay.classList.toggle('show');
});
sidebarOverlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
});

// New Chat
newChatBtn.addEventListener('click', () => {
  createSession();
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
});

// Theme Toggle
themeToggle.addEventListener('click', () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeToggle.textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
});

// ── Init ──
function init() {
  // Theme
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  // Sessions
  loadSessions();
  loadMessages();

  if (state.sessions.length === 0) {
    createSession();
  } else {
    state.currentSessionId = state.sessions[0].id;
    renderSessions();
    renderMessages();
    updateChatHeader();
  }

  // Health check
  fetch(`${API_BASE}/health`)
    .then(r => r.json())
    .then(d => {
      document.querySelector('.status-text').textContent = `运行中 · ${d.model || 'Recipe Assistant'}`;
    })
    .catch(() => {
      document.querySelector('.status-dot').style.background = '#ef4444';
      document.querySelector('.status-text').textContent = '服务未连接';
    });
}

init();
</script>
